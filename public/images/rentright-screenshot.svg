  <text x="30" y="525" font-family="Arial, sans-serif" font-size="12" fill="#B78A5F">Lekki Phase 1 • Inspected by RentRight</text>

  <!-- Second Property Card -->
  <rect x="400" y="250" width="360" height="280" rx="15" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="1"/>
  <rect x="410" y="260" width="340" height="160" rx="10" fill="#F8F8F8"/>
  <circle cx="730" cy="280" r="8" fill="#B78A5F"/>
  <text x="730" y="285" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">✓</text>
  <text x="410" y="445" font-family="Arial, sans-serif" font-size="12" fill="#666">Verified</text>
  <text x="410" y="465" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1A1814">₦1,800,000/year</text>
  <text x="410" y="485" font-family="Arial, sans-serif" font-size="14" fill="#666">1 Bed • Move-in cost: ₦2,340,000 total</text>
